<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Lato', sans-serif;
  background: #f5f7fa;
  color: #333;
}

/* HEADER */
header {
  background: #111;
  color: white;
  padding: 15px;
  text-align: center;
  font-family: 'Montserrat';
}

/* HERO */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 50px 8%;
  background: linear-gradient(135deg,#ffffff,#eef2f7);
}

.hero-content {
  max-width: 550px;
}

.hero h1 {
  font-size: 2.6rem;
}

.hero p {
  margin: 10px 0 20px;
}

/* FORM */
.form {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.form input, .form select {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  min-width: 170px;
}

button {
  padding: 12px 18px;
  background: #ff6b00;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #e55a00;
}

/* RESULT */
#result {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  color: green;
}

/* HERO IMAGE */
.hero img {
  width: 450px;
  border-radius: 12px;
}

/* SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
  background: white;
}

/* FILTERS */
.filters {
  margin-bottom: 20px;
}

.filters select {
  padding: 10px;
  margin: 5px;
}

/* BIKES */
.bikes {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  width: 280px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 10px;
}

.tag {
  color: green;
  font-size: 14px;
  font-weight: bold;
}

/* FOOTER */
footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}

/* MOBILE */
@media(max-width:768px){
  .hero {
    flex-direction: column;
    text-align: center;
  }
  .hero img {
    width: 100%;
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<header>
🚴 Born2Ride
</header>

<!-- HERO -->
<section class="hero">

<div class="hero-content">
<h1>Buy & Sell Used Bikes in Pune</h1>
<p>Instant price. Best deals. No hassle.</p>

<div class="form">
<select id="brand">
<option>Honda</option>
<option>Bajaj</option>
<option>Yamaha</option>
<option>TVS</option>
<option>Royal Enfield</option>
</select>

<input id="model" placeholder="Model">
<input id="km" type="number" placeholder="KM Driven">

<select id="owners">
<option value="1">1st Owner</option>
<option value="0.9">2nd Owner</option>
<option value="0.8">3rd Owner</option>
</select>

<input id="year" type="number" placeholder="Year">

<button onclick="calc()">Get Price</button>
</div>

<div id="result"></div>

<br>

<a href="https://wa.me/919876543210?text=I want to sell my bike" target="_blank">
<button>Sell My Bike</button>
</a>

</div>

<img src="https://images.unsplash.com/photo-1518655048521-f130df041f66">

</section>

<!-- BUY SECTION -->
<section class="section">

<h2>Available Bikes</h2>

<div class="filters">
<select>
<option>All Brands</option>
<option>Honda</option>
<option>Bajaj</option>
</select>

<select>
<option>Price Range</option>
<option>Below 50k</option>
<option>50k - 1L</option>
<option>Above 1L</option>
</select>
</div>

<div class="bikes">

<div class="card">
<img src="https://images.unsplash.com/photo-1580310614729-ccd69652491d">
<h3>Honda Activa</h3>

<button>Buy</button>
</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1558980664-10ea90d84f68">
<h3>Pulsar 150</h3>
<p>2019 • 22k km</p>
<p class="tag">✔ Verified</p>
<p><strong>₹60,000</strong></p>
<a href="https://wa.me/919876543210?text=I want Pulsar 150" target="_blank">
<button>Buy</button>
</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65">
<h3>Classic 350</h3>
<p>2021 • 15k km</p>
<p class="tag">✔ Verified</p>
<p><strong>₹1,20,000</strong></p>

</div>
</section>

<footer>
© 2026 Born2Ride

</footer>

<script>
function calc(){
let y = document.getElementById("year").value;
let km = document.getElementById("km").value;
let o = document.getElementById("owners").value;

if(!y || !km){ alert("Fill details"); return;}

let age = 2026 - y;
let dep = 1 - age*0.08;
if(dep<0.4) dep=0.4;

let kmf = km>30000?0.85:1;

let price = 90000*dep*kmf*o;

document.getElementById("result").innerText =
"Estimated Price: ₹"+Math.round(price)+" - ₹"+Math.round(price*1.1);
}
</script>

</body>
</html>
