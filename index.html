<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Resale Platform</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Lato', sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: white;
    }

    .hero h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 34px;
    }

    .calculator {
      margin-top: 30px;
    }

    input, select {
      padding: 12px;
      margin: 10px;
      width: 220px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #e55a00;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: green;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .steps {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .step {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    footer {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>🚴 Bike Resale</h1>
</header>

<section class="hero">
  <h2>Sell Your Bike Instantly</h2>
  <p>India’s smartest bike resale platform</p>

  <!-- ✅ CALCULATOR START -->
  <div class="calculator">

    <select id="brand">
      <option>Honda</option>
      <option>Yamaha</option>
      <option>Bajaj</option>
      <option>TVS</option>
    </select>

    <br>

    <input type="number" id="year" placeholder="Year of purchase">
    <input type="number" id="km" placeholder="KM driven">

    <br>

    <select id="condition">
      <option value="1">Good Condition</option>
      <option value="0.8">Average Condition</option>
      <option value="0.6">Poor Condition</option>
    </select>

    <br>

    <button onclick="calculatePrice()">Get Price</button>

    <div id="result"></div>

    <br>

    <button>Sell My Bike</button>

  </div>
  <!-- ✅ CALCULATOR END -->

</section>

<section class="section">
  <h2>How It Works</h2>
  <div class="steps">
    <div class="step">1️⃣ Enter Bike Details</div>
    <div class="step">2️⃣ Get Instant Price</div>
    <div class="step">3️⃣ Sell Your Bike</div>
  </div>
</section>

<section class="section">
  <h2>Why Choose Us</h2>
  <p>Fast • Easy • Trusted</p>
</section>

<footer>
  <p>© 2026 Bike Resale Platform</p>
</footer>

<!-- ✅ SCRIPT (CALCULATOR LOGIC) -->
<script>
function calculatePrice() {
  let year = document.getElementById("year").value;
  let km = document.getElementById("km").value;
  let condition = document.getElementById("condition").value;

  if (!year || !km) {
    alert("Please fill all details");
    return;
  }

  let age = 2026 - year;

  let depreciation = 1 - (age * 0.08);
  if (depreciation < 0.4) depreciation = 0.4;

  let kmFactor = km > 20000 ? 0.9 : 1;

  let basePrice = 90000;

  let price = basePrice * depreciation * condition * kmFactor;

  document.getElementById("result").innerText =
    "Estimated Price: ₹" + Math.round(price) +
    " - ₹" + Math.round(price * 1.1);
}
</script>

</body>
</html>
