<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Resale Platform</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Lato', sans-serif; margin: 0; background: #f5f7fa; }
    header { background: #111; color: white; padding: 15px 30px; }
    .hero { text-align: center; padding: 60px 20px; background: white; }
    .hero h2 { font-family: 'Montserrat'; font-size: 34px; }

    input, select {
      padding: 12px;
      margin: 10px;
      width: 230px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🚴 Bike Resale</h1>
</header>

<section class="hero">
  <h2>Sell Your Bike Instantly</h2>
  <p>Get best resale value in seconds</p>

  <!-- 🔥 UPDATED CALCULATOR -->
  <div>

    <!-- Company -->
    <select id="brand">
      <option>Honda</option>
      <option>Yamaha</option>
      <option>Bajaj</option>
      <option>TVS</option>
      <option>Royal Enfield</option>
    </select>

    <!-- Model -->
    <input type="text" id="model" placeholder="Bike Model">

    <br>

    <!-- KM -->
    <input type="number" id="km" placeholder="KM Driven">

    <!-- Owners -->
    <select id="owners">
      <option value="1">1st Owner</option>
      <option value="0.9">2nd Owner</option>
      <option value="0.8">3rd Owner</option>
    </select>

    <br>

    <!-- Year -->
    <input type="number" id="year" placeholder="Year of Registration">

    <br><br>

    <button onclick="calculatePrice()">Get Price</button>

    <div id="result"></div>

  </div>

</section>

<script>
function calculatePrice() {
  let year = document.getElementById("year").value;
  let km = document.getElementById("km").value;
  let owners = document.getElementById("owners").value;

  if (!year || !km) {
    alert("Please fill all details");
    return;
  }

  let age = 2026 - year;

  // depreciation
  let depreciation = 1 - (age * 0.08);
  if (depreciation < 0.4) depreciation = 0.4;

  // km effect
  let kmFactor = km > 30000 ? 0.85 : 1;

  // owner effect
  let ownerFactor = owners;

  let basePrice = 90000;

  let price = basePrice * depreciation * kmFactor * ownerFactor;

  document.getElementById("result").innerText =
    "Estimated Price: ₹" + Math.round(price) +
    " - ₹" + Math.round(price * 1.1);
}
</script>

</body>
</html>
